<!doctype html>
<!-- The simplest possible case. Read the README first; it is enough to write this page. -->
<meta charset="utf-8">
<title>text page</title>
<input id="box" placeholder="type and press Enter" autofocus><pre id="log"></pre>
<script type="module">
  import "./log.js";                             // the two log streams, in the browser console: recorded events and adapter callbacks, each on its own
  import { ConnectConversation } from "./ConnectConversation.js";
  const show = (t) => { document.getElementById("log").textContent += t + "\n"; };
  ConnectConversation({
    way: "text",
    onUserMessage: (t) => show(`YOU: ${t}`),
    onBotMessage: (t) => show(`BOT: ${t}`),
    input: "#box",                                   // Enter sends the typed line
  });
</script>
